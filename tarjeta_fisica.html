<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tarjeta Física - Mar & Tierra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-blue: #0A2463;
            --color-orange: #FF6B35;
            --color-sand: #FFFFFF;
            --color-text: #2D2D2D;
        }

        body {
            margin: 0;
            background: #eee;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            width: 850px;
            height: 500px;
            background: var(--color-sand);
            margin: 50px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            box-sizing: border-box;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .left-col {
            flex: 1;
        }

        .contact-info {
            margin-bottom: 40px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 26px;
            color: var(--color-blue);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-item i {
            color: var(--color-orange);
            width: 35px;
        }

        .services-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .services-list li {
            font-size: 22px;
            color: var(--color-text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .services-list li::before {
            content: "■";
            color: var(--color-orange);
            font-size: 14px;
        }

        .right-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-frame {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #ccc;
        }

        .qr-img {
            width: 220px;
            height: 220px;
            display: block;
        }
    </style>
</head>

<body>

    <!-- FRENTE DE LA TARJETA -->
    <div class="card" style="justify-content: center; background: #0A2463; overflow: hidden; padding: 0;">
        <img src="Imagenes/Logo_sin fondo1.png" style="width: 100%; height: 100%; object-fit: contain;"
            alt="Frente Mar & Tierra">
    </div>

    <div style="text-align: center; margin: 20px 0; color: #666; font-weight: bold; font-family: sans-serif;">--- DORSO
        ---</div>

    <!-- DORSO DE LA TARJETA -->
    <div class="card" style="justify-content: space-around; padding: 0 40px;">
        <div class="contact-info" style="margin-bottom: 0;">
            <div class="contact-item"
                style="font-size: 36px; margin-bottom: 30px; border-bottom: 3px solid var(--color-orange); padding-bottom: 8px; width: fit-content;">
                <i class="fas fa-user"></i>
                <span>Francisco Abraham</span>
            </div>
            <div class="contact-item" style="font-size: 28px; margin-bottom: 20px;">
                <i class="fab fa-whatsapp"></i>
                <span>2235429896</span>
            </div>
            <div class="contact-item" style="font-size: 28px;">
                <i class="fas fa-envelope"></i>
                <span>martierra.servicios@gmail.com</span>
            </div>
        </div>

        <div class="right-col">
            <div class="qr-frame" style="padding: 20px;">
                <img src="Imagenes/QR wsp.jpeg" class="qr-img" style="width: 240px; height: 240px;" alt="QR Contacto">
            </div>
        </div>
    </div>

</body>

</html>
